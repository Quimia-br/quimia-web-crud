name: Melhoria
description: Sugestão de funcionalidade nova ou de ajuste
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema ou necessidade
      description: O que hoje atrapalha ou falta.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como você imagina a solução
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas

name: Bug
description: Algo no painel não funciona como deveria
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Não cole senhas, chaves nem dados pessoais reais.
        Falha de segurança não vira issue pública: use a aba Security > Report a vulnerability.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      description: Tela, passos e, se houver, a mensagem de erro.
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Onde aconteceu
      description: Produção (quimia.tech/admin) ou local, e o navegador, se for problema de tela.

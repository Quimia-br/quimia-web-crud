name: PR title

# O título do PR precisa seguir o Conventional Commits, porque é ele que aparece nas notas do release
# e na escolha da versão. Exemplos: "feat(sidebar): add a pin button", "fix: keep the menu open", "docs: add README".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o título
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::O título do PR precisa seguir o Conventional Commits: tipo(escopo opcional): descrição"
            echo "Tipos aceitos: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo "Exemplo: feat(sidebar): add a pin button"
            echo "Título atual: $TITLE"
            exit 1
          fi
          echo "Título válido: $TITLE"

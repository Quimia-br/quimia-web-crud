spring.application.name=QuimiaWebCrud

# Valores locais (banco, pasta de fotos...) vem do arquivo .env; sem ele o app ainda le este arquivo (util nos testes)
spring.config.import=optional:file:.env[.properties]

# Banco de dados (PostgreSQL no Aiven) e pool de conexoes
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
# Declarado de proposito: sem o .env a URL fica como texto e o driver nao poderia ser descoberto a partir dela
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=30000

# O schema agora e criado pelos scripts ddl.sql + foreign_keys.sql;
# o Hibernate apenas confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
# Declarado de proposito: permite montar o Hibernate sem abrir conexao (testes sem banco)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Servidor. O Render define PORT; o prefixo (APP_CONTEXT_PATH, ex.: /admin) permite o painel ficar sob quimia.tech/admin.
# O forward-headers faz o app respeitar os cabecalhos X-Forwarded-* do proxy (Cloudflare e Render): sabe que esta em HTTPS e qual o dominio.
server.port=${PORT:8080}
server.servlet.context-path=${APP_CONTEXT_PATH:}
server.forward-headers-strategy=framework

# Textos do painel em português e inglês (messages*.properties). O idioma padrão é o português, sem olhar o navegador.
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Sessao do painel: expira por inatividade; cookie so acessivel pelo servidor e nao enviado por outros sites
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Em producao com HTTPS defina SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Datas dos formularios (input date/datetime-local) chegam no formato ISO
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# Fotos enviadas: pasta no servidor e endereco publico usado nas URLs salvas no banco
# Onde as fotos ficam: "disk" (pasta do servidor, o padrao no computador de quem desenvolve) ou "r2" (bucket da
# Cloudflare R2). Em hospedagem que apaga o disco a cada reinicio, use r2. As chaves vem so do ambiente, nunca daqui.
app.storage.type=${STORAGE_TYPE:disk}
app.r2.endpoint=${R2_ENDPOINT:}
app.r2.region=${R2_REGION:auto}
app.r2.bucket=${R2_BUCKET:}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
# Limite do Spring (a validacao de 2 MB, com mensagem amigavel, esta no codigo)
# Segredo entre o proxy (Cloudflare) e este app: com ele definido, so entra pedido que traga o cabecalho X-Origin-Secret
# com o mesmo valor (o caminho /health fica de fora). Sem ele, o filtro fica desligado (computador de quem desenvolve).
app.origin-secret=${ORIGIN_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Conferência de cadastro em fontes externas, antes de gravar: o domínio do e-mail existe (DNS), o CNPJ está na Receita
# Federal (BrasilAPI) e o número CAS está no PubChem. Só barra quando a fonte diz com certeza que NÃO existe; fonte
# fora do ar deixa o cadastro seguir. Desligue uma conferência com false (ex.: se a fonte sair do ar por muito tempo).
app.verify.email=${VERIFY_EMAIL:true}
app.verify.cnpj=${VERIFY_CNPJ:true}
app.verify.cas=${VERIFY_CAS:true}
app.verify.timeout-ms=${VERIFY_TIMEOUT_MS:4000}

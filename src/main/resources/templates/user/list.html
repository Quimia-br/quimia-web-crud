<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar('users')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('Usuários', @{/users}, null)}"></header>
    <main class="content">
      <!--
        User list
        Model:   "users" -> List<User>
        Routes:  GET /users | GET /users/new | GET /users/{id}/edit | POST /users/{id}/delete
      -->
      <div class="page-head">
        <div>
          <h1 class="h1">Usuários</h1>
          <p>Pessoas cadastradas no aplicativo Quimia.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/users/new}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novo usuário</a>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <section class="card">
        <div class="card-toolbar">
          <label class="filter">
            <span class="sr-only">Filtrar usuários</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" placeholder="Filtrar usuários…" data-filter="#data-table" data-count="#row-count">
          </label>
          <span class="count" id="row-count" th:text="${#lists.size(users)} + ' registros'">0 registros</span>
        </div>
        <div class="table-wrap">
          <table class="data" id="data-table">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Nome</th>
                <th scope="col">Email</th>
                <th scope="col">Nascimento</th>
                <th scope="col">Cadastro</th>
                <th scope="col" class="actions"><span class="sr-only">Ações</span></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${users}" data-row>
                <td class="id" th:text="${item.id}">1</td>
                <td th:text="${item.name}">valor</td>
                <td th:text="${item.email}">valor</td>
                <td th:text="${item.birthDate != null ? #temporals.format(item.birthDate, 'dd/MM/yyyy') : '—'}">valor</td>
                <td th:text="${item.registrationDate != null ? #temporals.format(item.registrationDate, 'dd/MM/yyyy') : '—'}">valor</td>
                <td class="actions">
                  <a class="icon-btn edit" th:href="@{/users/{id}/edit(id=${item.id})}" title="Editar" aria-label="Editar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></a>
                  <button type="button" class="icon-btn delete" title="Excluir" aria-label="Excluir"
                          th:attr="data-delete-url=@{/users/{id}/delete(id=${item.id})},data-delete-name=${item.name}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
                </td>
              </tr>
              <tr data-no-result hidden>
                <td class="empty" colspan="6"><strong>Nenhum resultado</strong>Nenhum registro corresponde ao filtro.</td>
              </tr>
              <tr th:if="${#lists.isEmpty(users)}">
                <td class="empty" colspan="6">
                  <strong>Nenhum usuário cadastrado</strong>
                  Clique em “Novo usuário” para adicionar o primeiro registro.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <dialog th:replace="~{fragments/layout :: confirmDelete}"></dialog>
    </main>
  </div>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

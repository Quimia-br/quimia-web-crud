<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar('')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('Erro', null, null)}"></header>
    <main class="content">
      <!--
        Standard error page
        Model:   "details" -> ErrorDetails (status, error, message, path, timestamp)
        Used by: GlobalExceptionHandler
      -->
      <div class="page-head">
        <div>
          <h1 class="h1" th:text="${details.status} + ' · ' + ${details.error}">500 · Internal Server Error</h1>
          <p>Não foi possível concluir a operação.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/}">Voltar ao início</a>
      </div>

      <div class="alert alert-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><span th:text="${details.message}">Ocorreu um erro inesperado.</span>
      </div>

      <section class="card form-card">
        <p>Endereço: <span class="code" th:text="${details.path}">/exemplo</span></p>
        <p>Data e hora: <span th:text="${#temporals.format(details.timestamp, 'dd/MM/yyyy HH:mm:ss')}">01/01/2026 00:00:00</span></p>
      </section>
    </main>
  </div>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

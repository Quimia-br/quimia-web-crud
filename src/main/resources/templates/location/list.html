<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/head :: head('Localização', ${ {'detail'} }, false)}"></head>

<body>
    <th:block th:replace="~{fragments/sidebar :: sidebar('/locations')}"></th:block>

    <main class="content">
        <header class="page-header">
            <h1>Localização</h1>
        </header>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form class="toolbar" method="get">
            <div class="toolbar-search">
                <label for="cep" class="sr-only">Buscar por CEP</label>
                <input type="search" id="cep" name="cep" placeholder="Buscar por CEP..." th:value="${filters['cep']}">
            </div>
            <div class="toolbar-filter">
                <label for="usuario">Usuário</label>
                <select id="usuario" name="usuario">
                    <option value="">Todos</option>
                    <option th:each="o : ${usersById.values()}" th:value="${o.id}" th:text="${o.userName}" th:selected="${filters['usuario'] == #strings.toString(o.id)}">Opção</option>
                </select>
            </div>
            <div class="toolbar-filter">
                <label for="coordenadas">Coordenadas</label>
                <select id="coordenadas" name="coordenadas">
                    <option value="">Todas</option>
                    <option value="COM" th:selected="${filters['coordenadas'] == 'COM'}">Com coordenadas</option>
                    <option value="SEM" th:selected="${filters['coordenadas'] == 'SEM'}">Sem coordenadas</option>
                </select>
            </div>
            <button type="submit" class="btn btn-secondary">Buscar</button>
        </form>

        <section class="card" aria-label="Lista de localizações">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Usuário</th>
                        <th scope="col">CEP</th>
                        <th scope="col">Latitude</th>
                        <th scope="col">Longitude</th>
                        <th scope="col" class="col-actions">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${locations}">
                        <td>[[${item.id}]]</td>
                        <td>[[${usersById[item.userId]?.userName}]]</td>
                        <td class="cell-nowrap">[[${item.zipCode}]]</td>
                        <td>[[${item.latitude}]]</td>
                        <td>[[${item.longitude}]]</td>
                        <td class="col-actions">
                            <button type="button" class="btn-icon" th:attr="aria-label=|Ver localização de ${usersById[item.userId]?.userName}|,popovertarget=|ver-location-${item.id}|"><img src="../../static/icons/view.svg" th:src="@{/icons/view.svg}" alt=""></button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(locations)}">
                        <td colspan="6">Nenhum registro encontrado.</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <nav th:replace="~{fragments/pagination :: pagination(${page}, ${basePath}, ${query})}"></nav>
    </main>

    <!-- Detalhes de cada registro (somente leitura) -->
    <th:block th:each="item : ${locations}">
    <dialog class="modal" popover th:attr="id=|ver-location-${item.id}|,aria-labelledby=|ver-location-${item.id}-titulo|">
        <header class="modal-header">
            <div>
                <h2 th:attr="id=|ver-location-${item.id}-titulo|">Localização</h2>
                <p>ID [[${item.id}]]</p>
            </div>
            <button type="button" class="btn-icon" aria-label="Fechar" popovertargetaction="hide" th:attr="popovertarget=|ver-location-${item.id}|"><img src="../../static/icons/close.svg" th:src="@{/icons/close.svg}" alt=""></button>
        </header>

        <div class="modal-form">
            <dl class="detail-list">
                <div><dt>Usuário</dt><dd th:text="${usersById[item.userId]?.userName != null and !#strings.isEmpty(usersById[item.userId]?.userName) ? usersById[item.userId]?.userName : '—'}">valor</dd></div>
                <div><dt>CEP</dt><dd th:text="${item.zipCode != null and !#strings.isEmpty(item.zipCode) ? item.zipCode : '—'}">valor</dd></div>
                <div><dt>Latitude</dt><dd th:text="${item.latitude != null and !#strings.isEmpty(item.latitude) ? item.latitude : '—'}">valor</dd></div>
                <div><dt>Longitude</dt><dd th:text="${item.longitude != null and !#strings.isEmpty(item.longitude) ? item.longitude : '—'}">valor</dd></div>
            </dl>

            <footer class="modal-footer">
                <button type="button" class="btn btn-secondary" popovertargetaction="hide" th:attr="popovertarget=|ver-location-${item.id}|">Fechar</button>
            </footer>
        </div>
    </dialog>
    </th:block>
</body>
</html>

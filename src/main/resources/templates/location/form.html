<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Localização')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar('locations')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('Localizações', @{/locations}, ${location.id == null ? 'Nova localização' : 'Editar'})}"></header>
    <main class="content">
      <!--
        Location form (create and edit)
        Model:   "location" -> Location (null id = create)
                 "users" -> List (select options)
        Submit:  POST /locations/save  (use @Valid + BindingResult to show per-field errors)
      -->
      <div class="page-head">
        <div>
          <h1 class="h1" th:text="${location.id == null} ? 'Nova localização' : 'Editar localização'">Nova localização</h1>
          <p th:if="${location.id != null}">Registro <span class="code" th:text="'#' + ${location.id}">#1</span></p>
          <p th:if="${location.id == null}">Preencha os campos abaixo. Campos com <span style="color:var(--feedback-error)">*</span> são obrigatórios.</p>
        </div>
        <a class="btn btn-ghost" th:href="@{/locations}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Voltar</a>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <form class="card form-card" th:action="@{/locations/save}" th:object="${location}" method="post" novalidate>
        <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</span>
        </div>
        <input type="hidden" th:field="*{id}">
        <div class="form-section">
          <h2 class="h3" style="margin-bottom:var(--space-4)">Dados da localização</h2>
          <div class="form-grid">
            <div class="field" th:classappend="${#fields.hasErrors('user.id')} ? 'has-error'">
              <label for="user">Usuário</label>
              <select th:field="*{user.id}" id="user">
                <option value="">Selecione…</option>
                <option th:each="o : ${users}" th:value="${o.id}" th:text="${o.name}">Opção</option>
              </select>
              <span class="error" th:if="${#fields.hasErrors('user.id')}" th:errors="*{user.id}">Erro</span>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('zipCode')} ? 'has-error'">
              <label for="zipCode">CEP<span class="req" aria-hidden="true">*</span></label>
              <input type="number" th:field="*{zipCode}" id="zipCode" class="mono" placeholder="Somente números" step="any" required>
              <span class="error" th:if="${#fields.hasErrors('zipCode')}" th:errors="*{zipCode}">Erro</span>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('latitude')} ? 'has-error'">
              <label for="latitude">Latitude</label>
              <input type="text" th:field="*{latitude}" id="latitude" class="mono" placeholder="-23.5505">
              <span class="error" th:if="${#fields.hasErrors('latitude')}" th:errors="*{latitude}">Erro</span>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('longitude')} ? 'has-error'">
              <label for="longitude">Longitude</label>
              <input type="text" th:field="*{longitude}" id="longitude" class="mono" placeholder="-46.6333">
              <span class="error" th:if="${#fields.hasErrors('longitude')}" th:errors="*{longitude}">Erro</span>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" th:href="@{/locations}">Cancelar</a>
          <button type="submit" class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h8V3"/><path d="M8 21v-7h8v7"/></svg>Salvar</button>
        </div>
      </form>
    </main>
  </div>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante | Quimia</title>
    <link rel="icon" type="image/svg+xml" href="../../static/icons/logo.svg" th:href="@{/icons/logo.svg}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap">

    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="../../static/css/detail.css" th:href="@{/css/detail.css}">
    <script src="../../static/js/sidebar.js" th:src="@{/js/sidebar.js}"></script>
</head>

<body>
    <th:block th:replace="~{fragments/sidebar :: sidebar('/shelves')}"></th:block>

    <main class="content">
        <header class="page-header">
            <h1>Estante</h1>
        </header>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form class="toolbar" method="get">
            <div class="toolbar-search">
                <label for="busca" class="sr-only">Buscar por cômodo</label>
                <input type="search" id="busca" name="busca" placeholder="Buscar por cômodo..." th:value="${filters['busca']}">
            </div>
            <div class="toolbar-filter">
                <label for="usuario">Usuário</label>
                <select id="usuario" name="usuario">
                    <option value="">Todos</option>
                    <option th:each="o : ${usersById.values()}" th:value="${o.id}" th:text="${o.userName}" th:selected="${filters['usuario'] == #strings.toString(o.id)}">Opção</option>
                </select>
            </div>
            <div class="toolbar-filter">
                <label for="produto">Contém produto</label>
                <select id="produto" name="produto">
                    <option value="">Qualquer</option>
                    <option th:each="o : ${productsById.values()}" th:value="${o.id}" th:text="${o.name}" th:selected="${filters['produto'] == #strings.toString(o.id)}">Opção</option>
                </select>
            </div>
            <button type="submit" class="btn btn-secondary">Buscar</button>
        </form>

        <section class="card" aria-label="Lista de estantes">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Cômodo</th>
                        <th scope="col">Usuário</th>
                        <th scope="col" class="col-actions">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${shelves}">
                        <td>[[${item.id}]]</td>
                        <td>[[${item.room}]]</td>
                        <td>[[${usersById[item.userId]?.userName}]]</td>
                        <td class="col-actions">
                            <button type="button" class="btn-icon" th:attr="aria-label=|Ver estante ${item.room} de ${usersById[item.userId]?.userName}|,popovertarget=|ver-shelf-${item.id}|"><img src="../../static/icons/view.svg" th:src="@{/icons/view.svg}" alt=""></button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(shelves)}">
                        <td colspan="4">Nenhum registro encontrado.</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <nav th:replace="~{fragments/pagination :: pagination(${page}, ${basePath}, ${query})}"></nav>
    </main>

    <!-- Detalhes de cada registro (somente leitura) -->
    <th:block th:each="item : ${shelves}">
    <dialog class="modal" popover th:attr="id=|ver-shelf-${item.id}|,aria-labelledby=|ver-shelf-${item.id}-titulo|">
        <header class="modal-header">
            <div>
                <h2 th:attr="id=|ver-shelf-${item.id}-titulo|">Estante</h2>
                <p>ID [[${item.id}]]</p>
            </div>
            <button type="button" class="btn-icon" aria-label="Fechar" popovertargetaction="hide" th:attr="popovertarget=|ver-shelf-${item.id}|"><img src="../../static/icons/close.svg" th:src="@{/icons/close.svg}" alt=""></button>
        </header>

        <div class="modal-form">
            <dl class="detail-list">
                <div><dt>Cômodo</dt><dd th:text="${item.room != null and !#strings.isEmpty(item.room) ? item.room : '—'}">valor</dd></div>
                <div><dt>Usuário</dt><dd th:text="${usersById[item.userId]?.userName != null and !#strings.isEmpty(usersById[item.userId]?.userName) ? usersById[item.userId]?.userName : '—'}">valor</dd></div>
            </dl>

            <footer class="modal-footer">
                <button type="button" class="btn btn-secondary" popovertargetaction="hide" th:attr="popovertarget=|ver-shelf-${item.id}|">Fechar</button>
            </footer>
        </div>
    </dialog>
    </th:block>
</body>
</html>

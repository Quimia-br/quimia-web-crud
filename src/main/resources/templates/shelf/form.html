<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Estante')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar('shelves')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('Estantes', @{/shelves}, ${shelf.id == null ? 'Nova estante' : 'Editar'})}"></header>
    <main class="content">
      <!--
        Shelf form (create and edit)
        Model:   "shelf" -> Shelf (null id = create)
                 "users" -> List (select options)
        Submit:  POST /shelves/save  (use @Valid + BindingResult to show per-field errors)
      -->
      <div class="page-head">
        <div>
          <h1 class="h1" th:text="${shelf.id == null} ? 'Nova estante' : 'Editar estante'">Nova estante</h1>
          <p th:if="${shelf.id != null}">Registro <span class="code" th:text="'#' + ${shelf.id}">#1</span></p>
          <p th:if="${shelf.id == null}">Preencha os campos abaixo. Campos com <span style="color:var(--feedback-error)">*</span> são obrigatórios.</p>
        </div>
        <a class="btn btn-ghost" th:href="@{/shelves}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Voltar</a>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <form class="card form-card" th:action="@{/shelves/save}" th:object="${shelf}" method="post" novalidate>
        <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</span>
        </div>
        <input type="hidden" th:field="*{id}">
        <div class="form-section">
          <h2 class="h3" style="margin-bottom:var(--space-4)">Dados da estante</h2>
          <div class="form-grid">
            <div class="field" th:classappend="${#fields.hasErrors('user.id')} ? 'has-error'">
              <label for="user">Usuário<span class="req" aria-hidden="true">*</span></label>
              <select th:field="*{user.id}" id="user" required>
                <option value="">Selecione…</option>
                <option th:each="o : ${users}" th:value="${o.id}" th:text="${o.name}">Opção</option>
              </select>
              <span class="error" th:if="${#fields.hasErrors('user.id')}" th:errors="*{user.id}">Erro</span>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('room')} ? 'has-error'">
              <label for="room">Cômodo<span class="req" aria-hidden="true">*</span></label>
              <input type="text" th:field="*{room}" id="room" placeholder="Ex.: Cozinha, lavanderia" required>
              <span class="error" th:if="${#fields.hasErrors('room')}" th:errors="*{room}">Erro</span>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" th:href="@{/shelves}">Cancelar</a>
          <button type="submit" class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h8V3"/><path d="M8 21v-7h8v7"/></svg>Salvar</button>
        </div>
      </form>
    </main>
  </div>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

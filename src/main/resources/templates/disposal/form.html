<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ficha de descarte')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar('disposals')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('Fichas de descarte (FDS)', @{/disposals}, ${disposal.id == null ? 'Nova ficha de descarte' : 'Editar'})}"></header>
    <main class="content">
      <!--
        Disposal form (create and edit)
        Model:   "disposal" -> Disposal (null id = create)
                 "products" -> List (select options)
        Submit:  POST /disposals/save  (use @Valid + BindingResult to show per-field errors)
      -->
      <div class="page-head">
        <div>
          <h1 class="h1" th:text="${disposal.id == null} ? 'Nova ficha de descarte' : 'Editar ficha de descarte'">Nova ficha de descarte</h1>
          <p th:if="${disposal.id != null}">Registro <span class="code" th:text="'#' + ${disposal.id}">#1</span></p>
          <p th:if="${disposal.id == null}">Preencha os campos abaixo. Campos com <span style="color:var(--feedback-error)">*</span> são obrigatórios.</p>
        </div>
        <a class="btn btn-ghost" th:href="@{/disposals}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Voltar</a>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <form class="card form-card" th:action="@{/disposals/save}" th:object="${disposal}" method="post" novalidate>
        <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</span>
        </div>
        <input type="hidden" th:field="*{id}">
        <div class="form-section">
          <h2 class="h3" style="margin-bottom:var(--space-4)">Dados da ficha de descarte</h2>
          <div class="form-grid">
            <div class="field full" th:classappend="${#fields.hasErrors('product.id')} ? 'has-error'">
              <label for="product">Produto<span class="req" aria-hidden="true">*</span></label>
              <select th:field="*{product.id}" id="product" required>
                <option value="">Selecione…</option>
                <option th:each="o : ${products}" th:value="${o.id}" th:text="${o.name}">Opção</option>
              </select>
              <span class="error" th:if="${#fields.hasErrors('product.id')}" th:errors="*{product.id}">Erro</span>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('productDisposalMethod')} ? 'has-error'">
              <label for="productDisposalMethod">Método de descarte do produto</label>
              <textarea th:field="*{productDisposalMethod}" id="productDisposalMethod" rows="4"></textarea>
              <span class="error" th:if="${#fields.hasErrors('productDisposalMethod')}" th:errors="*{productDisposalMethod}">Erro</span>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('packagingDisposalMethod')} ? 'has-error'">
              <label for="packagingDisposalMethod">Método de descarte da embalagem</label>
              <textarea th:field="*{packagingDisposalMethod}" id="packagingDisposalMethod" rows="4"></textarea>
              <span class="error" th:if="${#fields.hasErrors('packagingDisposalMethod')}" th:errors="*{packagingDisposalMethod}">Erro</span>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('domesticDisposalRestrictions')} ? 'has-error'">
              <label for="domesticDisposalRestrictions">Restrições de descarte doméstico</label>
              <textarea th:field="*{domesticDisposalRestrictions}" id="domesticDisposalRestrictions" rows="4"></textarea>
              <span class="error" th:if="${#fields.hasErrors('domesticDisposalRestrictions')}" th:errors="*{domesticDisposalRestrictions}">Erro</span>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('environmentalPrecautions')} ? 'has-error'">
              <label for="environmentalPrecautions">Precauções ambientais</label>
              <textarea th:field="*{environmentalPrecautions}" id="environmentalPrecautions" rows="4"></textarea>
              <span class="error" th:if="${#fields.hasErrors('environmentalPrecautions')}" th:errors="*{environmentalPrecautions}">Erro</span>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" th:href="@{/disposals}">Cancelar</a>
          <button type="submit" class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h8V3"/><path d="M8 21v-7h8v7"/></svg>Salvar</button>
        </div>
      </form>
    </main>
  </div>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

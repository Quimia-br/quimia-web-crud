<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Selo de status: verde (Ativo), vermelho (Bloqueado/Desativado) ou cinza (demais). -->
    <span th:fragment="status(value)" class="badge"
          th:classappend="${value == null} ? 'badge-neutral' : (${value.name() == 'ATIVO'} ? 'badge-success' : (${value.name() == 'BLOQUEADO' or value.name() == 'DESATIVADO'} ? 'badge-danger' : 'badge-neutral'))"
          th:text="${value == null} ? '' : ${#strings.capitalize(#strings.toLowerCase(value.name()))}">Ativo</span>

    <!-- Selo do tipo de alteração do histórico de administradores. -->
    <span th:fragment="action(value)" class="badge"
          th:classappend="${value == null} ? 'badge-neutral' : (${value.name() == 'INSERT'} ? 'badge-success' : (${value.name() == 'DELETE'} ? 'badge-danger' : 'badge-neutral'))"
          th:text="${value == null} ? '' : (${value.name() == 'INSERT'} ? 'Criação' : (${value.name() == 'DELETE'} ? 'Exclusão' : 'Alteração'))">Alteração</span>
</body>
</html>

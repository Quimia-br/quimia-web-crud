<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Menu lateral de todas as telas. Parâmetro: o caminho da tela atual (ex.: '/users'), que fica destacada; o grupo Relatórios abre sozinho quando a tela é uma das dele. -->
    <aside class="sidebar" th:fragment="sidebar(active)">
        <a href="../dashboard/index.html" th:href="@{/}" class="sidebar-logo">
            <img src="../../static/icons/logo.svg" th:src="@{/icons/logo.svg}" alt="Quimia">
        </a>

        <nav class="sidebar-nav" aria-label="Menu principal">
            <ul>
                <li><a href="../dashboard/index.html" th:href="@{/}" class="nav-link" th:attr="aria-current=${active == '/'} ? 'page' : null" title="Dashboard"><img src="../../static/icons/chart-column.svg" th:src="@{/icons/chart-column.svg}" alt=""><span class="nav-label">Dashboard</span></a></li>
                <li><a href="../admin/list.html" th:href="@{/admins}" class="nav-link" th:attr="aria-current=${active == '/admins'} ? 'page' : null" title="Administradores"><img src="../../static/icons/admin.svg" th:src="@{/icons/admin.svg}" alt=""><span class="nav-label">Administradores</span></a></li>
                <li><a href="../company/list.html" th:href="@{/companies}" class="nav-link" th:attr="aria-current=${active == '/companies'} ? 'page' : null" title="Empresas"><img src="../../static/icons/company.svg" th:src="@{/icons/company.svg}" alt=""><span class="nav-label">Empresas</span></a></li>
                <li><a href="../user/list.html" th:href="@{/users}" class="nav-link" th:attr="aria-current=${active == '/users'} ? 'page' : null" title="Usuários"><img src="../../static/icons/user.svg" th:src="@{/icons/user.svg}" alt=""><span class="nav-label">Usuários</span></a></li>
                <li><a href="../product/list.html" th:href="@{/products}" class="nav-link" th:attr="aria-current=${active == '/products'} ? 'page' : null" title="Produtos"><img src="../../static/icons/product.svg" th:src="@{/icons/product.svg}" alt=""><span class="nav-label">Produtos</span></a></li>
                <li><a href="../disposal/list.html" th:href="@{/disposals}" class="nav-link" th:attr="aria-current=${active == '/disposals'} ? 'page' : null" title="Descarte"><img src="../../static/icons/disposal.svg" th:src="@{/icons/disposal.svg}" alt=""><span class="nav-label">Descarte</span></a></li>
                <li><a href="../location/list.html" th:href="@{/locations}" class="nav-link" th:attr="aria-current=${active == '/locations'} ? 'page' : null" title="Localização"><img src="../../static/icons/location.svg" th:src="@{/icons/location.svg}" alt=""><span class="nav-label">Localização</span></a></li>
                <li><a href="../shelf/list.html" th:href="@{/shelves}" class="nav-link" th:attr="aria-current=${active == '/shelves'} ? 'page' : null" title="Estante"><img src="../../static/icons/shelf.svg" th:src="@{/icons/shelf.svg}" alt=""><span class="nav-label">Estante</span></a></li>
                <li><a href="../history-type/list.html" th:href="@{/history-types}" class="nav-link" th:attr="aria-current=${active == '/history-types'} ? 'page' : null" title="Tipo histórico"><img src="../../static/icons/history-type.svg" th:src="@{/icons/history-type.svg}" alt=""><span class="nav-label">Tipo histórico</span></a></li>

                <li>
                    <details class="nav-group" th:attr="open=${active == '/histories' or active == '/admin-logs'} ? 'open' : null">
                        <summary class="nav-link" title="Relatórios"><img src="../../static/icons/report.svg" th:src="@{/icons/report.svg}" alt=""><span class="nav-label">Relatórios</span></summary>
                        <ul>
                            <li><a href="../history/list.html" th:href="@{/histories}" class="nav-link" th:attr="aria-current=${active == '/histories'} ? 'page' : null" title="Usuários"><span class="nav-label">Usuários</span></a></li>
                            <li><a href="../admin-log/list.html" th:href="@{/admin-logs}" class="nav-link" th:attr="aria-current=${active == '/admin-logs'} ? 'page' : null" title="Administradores"><span class="nav-label">Administradores</span></a></li>
                        </ul>
                    </details>
                </li>
            </ul>
        </nav>

        <button type="button" class="nav-link sidebar-pin" aria-pressed="false" title="Fixar menu" data-sidebar-pin><img src="../../static/icons/pin.svg" th:src="@{/icons/pin.svg}" alt=""><span class="nav-label">Fixar menu</span></button>

        <form class="sidebar-logout-form" method="post" action="#" th:action="@{/logout}">
            <button type="submit" class="nav-link sidebar-logout" title="Sair"><img src="../../static/icons/logout.svg" th:src="@{/icons/logout.svg}" alt=""><span class="nav-label">Sair</span></button>
        </form>
    </aside>
</body>
</html>

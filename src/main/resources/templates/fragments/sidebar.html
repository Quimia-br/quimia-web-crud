<!DOCTYPE html>
<!-- Menu lateral do painel. -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
    <aside class="sidebar" th:fragment="sidebar(active)">
        <a href="../dashboard/index.html" th:href="@{/}" class="sidebar-logo">
            <img src="../../static/icons/logo.svg" th:src="@{/icons/logo.svg}" alt="Quimia">
        </a>

        <nav class="sidebar-nav" aria-label="Menu principal" th:attr="aria-label=#{nav.main}">
            <ul>
                <li><a href="../dashboard/index.html" th:href="@{/}" class="nav-link" th:attr="aria-current=${active == '/'} ? 'page' : null" title="Dashboard" th:title="#{nav.dashboard}"><img src="../../static/icons/chart-column.svg" th:src="@{/icons/chart-column.svg}" alt=""><span class="nav-label" th:text="#{nav.dashboard}">Dashboard</span></a></li>
                <li><a href="../admin/list.html" th:href="@{/admins}" class="nav-link" th:attr="aria-current=${active == '/admins'} ? 'page' : null" title="Administradores" th:title="#{nav.admins}"><img src="../../static/icons/admin.svg" th:src="@{/icons/admin.svg}" alt=""><span class="nav-label" th:text="#{nav.admins}">Administradores</span></a></li>
                <li><a href="../company/list.html" th:href="@{/companies}" class="nav-link" th:attr="aria-current=${active == '/companies'} ? 'page' : null" title="Empresas" th:title="#{nav.companies}"><img src="../../static/icons/company.svg" th:src="@{/icons/company.svg}" alt=""><span class="nav-label" th:text="#{nav.companies}">Empresas</span></a></li>
                <li><a href="../user/list.html" th:href="@{/users}" class="nav-link" th:attr="aria-current=${active == '/users'} ? 'page' : null" title="Usuários" th:title="#{nav.users}"><img src="../../static/icons/user.svg" th:src="@{/icons/user.svg}" alt=""><span class="nav-label" th:text="#{nav.users}">Usuários</span></a></li>
                <li><a href="../product/list.html" th:href="@{/products}" class="nav-link" th:attr="aria-current=${active == '/products'} ? 'page' : null" title="Produtos" th:title="#{nav.products}"><img src="../../static/icons/product.svg" th:src="@{/icons/product.svg}" alt=""><span class="nav-label" th:text="#{nav.products}">Produtos</span></a></li>
                <li><a href="../disposal/list.html" th:href="@{/disposals}" class="nav-link" th:attr="aria-current=${active == '/disposals'} ? 'page' : null" title="Descarte" th:title="#{nav.disposals}"><img src="../../static/icons/disposal.svg" th:src="@{/icons/disposal.svg}" alt=""><span class="nav-label" th:text="#{nav.disposals}">Descarte</span></a></li>
                <li><a href="../location/list.html" th:href="@{/locations}" class="nav-link" th:attr="aria-current=${active == '/locations'} ? 'page' : null" title="Localização" th:title="#{nav.locations}"><img src="../../static/icons/location.svg" th:src="@{/icons/location.svg}" alt=""><span class="nav-label" th:text="#{nav.locations}">Localização</span></a></li>
                <li><a href="../shelf/list.html" th:href="@{/shelves}" class="nav-link" th:attr="aria-current=${active == '/shelves'} ? 'page' : null" title="Estante" th:title="#{nav.shelves}"><img src="../../static/icons/shelf.svg" th:src="@{/icons/shelf.svg}" alt=""><span class="nav-label" th:text="#{nav.shelves}">Estante</span></a></li>
                <li><a href="../history-type/list.html" th:href="@{/history-types}" class="nav-link" th:attr="aria-current=${active == '/history-types'} ? 'page' : null" title="Tipo histórico" th:title="#{nav.historyTypes}"><img src="../../static/icons/history-type.svg" th:src="@{/icons/history-type.svg}" alt=""><span class="nav-label" th:text="#{nav.historyTypes}">Tipo histórico</span></a></li>

                <li>
                    <details class="nav-group" th:attr="open=${active == '/histories' or active == '/admin-logs'} ? 'open' : null">
                        <summary class="nav-link" title="Relatórios" th:title="#{nav.reports}"><img src="../../static/icons/report.svg" th:src="@{/icons/report.svg}" alt=""><span class="nav-label" th:text="#{nav.reports}">Relatórios</span></summary>
                        <ul>
                            <li><a href="../history/list.html" th:href="@{/histories}" class="nav-link" th:attr="aria-current=${active == '/histories'} ? 'page' : null" title="Usuários" th:title="#{nav.reports.users}"><span class="nav-label" th:text="#{nav.reports.users}">Usuários</span></a></li>
                            <li><a href="../admin-log/list.html" th:href="@{/admin-logs}" class="nav-link" th:attr="aria-current=${active == '/admin-logs'} ? 'page' : null" title="Administradores" th:title="#{nav.reports.admins}"><span class="nav-label" th:text="#{nav.reports.admins}">Administradores</span></a></li>
                        </ul>
                    </details>
                </li>
            </ul>
        </nav>

        <button type="button" class="nav-link sidebar-pin" aria-pressed="false" title="Fixar menu" th:title="#{nav.pin}" data-sidebar-pin><img src="../../static/icons/pin.svg" th:src="@{/icons/pin.svg}" alt=""><span class="nav-label" th:text="#{nav.pin}">Fixar menu</span></button>

        <form class="sidebar-logout-form" method="post" action="#" th:action="@{/logout}">
            <button type="submit" class="nav-link sidebar-logout" title="Sair" th:title="#{nav.logout}"><img src="../../static/icons/logout.svg" th:src="@{/icons/logout.svg}" alt=""><span class="nav-label" th:text="#{nav.logout}">Sair</span></button>
        </form>
    </aside>
</body>
</html>

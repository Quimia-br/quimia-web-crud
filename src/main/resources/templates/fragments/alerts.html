<!DOCTYPE html>
<!-- Avisos de sucesso e de erro depois de salvar ou excluir. -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="alerts" th:remove="tag">
        <p class="alert alert-success" role="status" th:if="${message != null}" th:text="${message}">Registro criado com sucesso.</p>
        <p class="alert alert-error" role="alert" th:if="${error != null}" th:text="${error}">Não foi possível concluir a operação.</p>
    </div>
</body>
</html>

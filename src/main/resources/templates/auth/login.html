<!DOCTYPE html>
<html lang="pt-BR" class="auth" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Quimia</title>
    <link rel="icon" type="image/svg+xml" href="../../static/icons/logo.svg" th:href="@{/icons/logo.svg}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap">

    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="../../static/css/auth.css" th:href="@{/css/auth.css}">

    <script src="../../static/js/password-toggle.js" th:src="@{/js/password-toggle.js}" defer></script>
</head>

<body>
    <header class="auth-brand">
        <img class="auth-logo" src="../../static/icons/logo.svg" th:src="@{/icons/logo.svg}" alt="Quimia">
        <p class="auth-welcome">Bem-vindo!</p>
    </header>

    <main class="auth-card">
        <h1>Acessar conta</h1>

        <p class="auth-message auth-message-error" role="alert" hidden th:hidden="${param.error == null}">E-mail ou senha inválidos.</p>
        <p class="auth-message auth-message-error" role="alert" hidden th:hidden="${param.blocked == null}">Muitas tentativas. Aguarde alguns minutos e tente de novo.</p>
        <p class="auth-message" role="status" hidden th:hidden="${param.logout == null}">Você saiu do painel.</p>

        <form class="auth-form" method="post" action="#" th:action="@{/login}">
            <label class="auth-field">
                <img src="../../static/icons/field-mail.svg" th:src="@{/icons/field-mail.svg}" alt="">
                <span class="sr-only">Email</span>
                <input type="email" name="email" placeholder="Email" autocomplete="username" maxlength="150" required autofocus>
            </label>

            <label class="auth-field">
                <img src="../../static/icons/field-password.svg" th:src="@{/icons/field-password.svg}" alt="">
                <span class="sr-only">Senha</span>
                <input type="password" name="password" placeholder="Senha" autocomplete="current-password" required>
                <button type="button" class="btn-icon password-toggle" data-password-toggle aria-pressed="false" aria-label="Mostrar senha"><img class="icon-eye" src="../../static/icons/view.svg" th:src="@{/icons/view.svg}" alt=""><img class="icon-eye-off" src="../../static/icons/eye-off.svg" th:src="@{/icons/eye-off.svg}" alt=""></button>
            </label>

            <button type="submit" class="btn btn-primary auth-submit">Entrar</button>
        </form>
    </main>
</body>
</html>

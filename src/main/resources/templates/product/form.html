<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produto')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar('products')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('Produtos', @{/products}, ${product.id == null ? 'Novo produto' : 'Editar'})}"></header>
    <main class="content">
      <!--
        Product form (create and edit)
        Model:   "product" -> Product (null id = create)
                 "companies" -> List (select options)
        Submit:  POST /products/save  (use @Valid + BindingResult to show per-field errors)
      -->
      <div class="page-head">
        <div>
          <h1 class="h1" th:text="${product.id == null} ? 'Novo produto' : 'Editar produto'">Novo produto</h1>
          <p th:if="${product.id != null}">Registro <span class="code" th:text="'#' + ${product.id}">#1</span></p>
          <p th:if="${product.id == null}">Preencha os campos abaixo. Campos com <span style="color:var(--feedback-error)">*</span> são obrigatórios.</p>
        </div>
        <a class="btn btn-ghost" th:href="@{/products}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Voltar</a>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <form class="card form-card" th:action="@{/products/save}" th:object="${product}" method="post" novalidate>
        <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</span>
        </div>
        <input type="hidden" th:field="*{id}">
        <div class="form-section">
          <h2 class="h3" style="margin-bottom:var(--space-4)">Dados do produto</h2>
          <div class="form-grid">
            <div class="field" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
              <label for="name">Nome<span class="req" aria-hidden="true">*</span></label>
              <input type="text" th:field="*{name}" id="name" required>
              <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Erro</span>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('brand')} ? 'has-error'">
              <label for="brand">Marca</label>
              <input type="text" th:field="*{brand}" id="brand">
              <span class="error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}">Erro</span>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('casNumber')} ? 'has-error'">
              <label for="casNumber">CAS number</label>
              <input type="number" th:field="*{casNumber}" id="casNumber" class="mono" step="any">
              <span class="error" th:if="${#fields.hasErrors('casNumber')}" th:errors="*{casNumber}">Erro</span>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('company.id')} ? 'has-error'">
              <label for="company">Empresa fabricante<span class="req" aria-hidden="true">*</span></label>
              <select th:field="*{company.id}" id="company" required>
                <option value="">Selecione…</option>
                <option th:each="o : ${companies}" th:value="${o.id}" th:text="${o.name}">Opção</option>
              </select>
              <span class="error" th:if="${#fields.hasErrors('company.id')}" th:errors="*{company.id}">Erro</span>
            </div>
            <div class="field full" th:classappend="${#fields.hasErrors('usageInstructions')} ? 'has-error'">
              <label for="usageInstructions">Instruções de uso</label>
              <textarea th:field="*{usageInstructions}" id="usageInstructions" rows="4"></textarea>
              <span class="error" th:if="${#fields.hasErrors('usageInstructions')}" th:errors="*{usageInstructions}">Erro</span>
            </div>
            <div class="field full" th:classappend="${#fields.hasErrors('technicalDosage')} ? 'has-error'">
              <label for="technicalDosage">Dosagem técnica</label>
              <textarea th:field="*{technicalDosage}" id="technicalDosage" rows="4"></textarea>
              <span class="error" th:if="${#fields.hasErrors('technicalDosage')}" th:errors="*{technicalDosage}">Erro</span>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" th:href="@{/products}">Cancelar</a>
          <button type="submit" class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h8V3"/><path d="M8 21v-7h8v7"/></svg>Salvar</button>
        </div>
      </form>
    </main>
  </div>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

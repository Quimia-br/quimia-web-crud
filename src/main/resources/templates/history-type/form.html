<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tipo de histórico')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar('history-types')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('Tipos de histórico', @{/history-types}, ${historyType.id == null ? 'Novo tipo de histórico' : 'Editar'})}"></header>
    <main class="content">
      <!--
        HistoryType form (create and edit)
        Model:   "historyType" -> HistoryType (null id = create)
        Submit:  POST /history-types/save  (use @Valid + BindingResult to show per-field errors)
      -->
      <div class="page-head">
        <div>
          <h1 class="h1" th:text="${historyType.id == null} ? 'Novo tipo de histórico' : 'Editar tipo de histórico'">Novo tipo de histórico</h1>
          <p th:if="${historyType.id != null}">Registro <span class="code" th:text="'#' + ${historyType.id}">#1</span></p>
          <p th:if="${historyType.id == null}">Preencha os campos abaixo. Campos com <span style="color:var(--feedback-error)">*</span> são obrigatórios.</p>
        </div>
        <a class="btn btn-ghost" th:href="@{/history-types}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Voltar</a>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <form class="card form-card" th:action="@{/history-types/save}" th:object="${historyType}" method="post" novalidate>
        <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</span>
        </div>
        <input type="hidden" th:field="*{id}">
        <div class="form-section">
          <h2 class="h3" style="margin-bottom:var(--space-4)">Dados do tipo de histórico</h2>
          <div class="form-grid">
            <div class="field full" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
              <label for="name">Nome<span class="req" aria-hidden="true">*</span></label>
              <input type="text" th:field="*{name}" id="name" required>
              <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Erro</span>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" th:href="@{/history-types}">Cancelar</a>
          <button type="submit" class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h8V3"/><path d="M8 21v-7h8v7"/></svg>Salvar</button>
        </div>
      </form>
    </main>
  </div>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
